<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkanoid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
      <div id="overlay" class="overlay" style="display: none;">
        <h2 id="overlay-title"></h2>
        <p id="overlay-message"></p>
        <p id="overlay-hint" class="overlay-hint">Presiona <kbd>R</kbd> para reiniciar</p>
      </div>
    </div>
    <aside class="info-panel">
      <h1>Arkanoid</h1>
      <div class="info-item">
        <span class="info-label">Puntaje</span>
        <span id="score" class="info-value">0</span>
      </div>
      <div class="info-item">
        <span class="info-label">Vidas</span>
        <span id="lives" class="info-value">3</span>
      </div>
      <div class="info-item">
        <span class="info-label">Nivel</span>
        <span id="level" class="info-value">1</span>
      </div>
      <div class="info-item">
        <span class="info-label">Sonido</span>
        <span id="sound-status" class="info-value">ON</span>
      </div>
      <div class="level-select">
        <h3>Niveles</h3>
        <div id="level-buttons" class="level-buttons"></div>
      </div>
      <div class="controls">
        <h3>Controles</h3>
        <ul>
          <li><kbd>←</kbd> <kbd>→</kbd> Mover paleta</li>
          <li>Ratón: Mover paleta</li>
          <li><kbd>↑</kbd> / <kbd>Espacio</kbd> Lanzar bola</li>
          <li><kbd>P</kbd> Pausar / Reanudar</li>
          <li><kbd>R</kbd> Reiniciar</li>
        </ul>
      </div>
    </aside>
  </div>
  <script src="assets/spritesheet.js"></script>
  <script src="game.js"></script>
</body>
</html>
